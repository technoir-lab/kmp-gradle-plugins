openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
tags:
  - name: Pet
    description: Manage pets and their owners' records.
paths:
  /pets:
    get:
      tags: [Pet]
      operationId: listPets
      summary: List all pets
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int64
            enum: [10, 20, 50]
            default: 20
        - name: field
          in: query
          description: Field to sort pets by.
          schema:
            type: string
        - name: in
          in: query
          description: Where the pets live.
          schema:
            type: string
            enum: [indoors, outdoors]
      responses:
        '200':
          description: All pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      tags: [Pet]
      operationId: addPet
      summary: Add a new pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/import:
    post:
      tags: [Pet]
      operationId: import
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The pets were imported
  /pets/{petId}:
    get:
      tags: [Pet]
      operationId: getPetById
      summary: Find a pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: includeDetails
          in: query
          schema:
            type: boolean
        - name: X-Request-ID
          in: header
          schema:
            type: string
        - name: sessionId
          in: cookie
          schema:
            type: string
        - name: requestUri
          in: query
          schema:
            type: string
            format: uri
        - name: requestUuid
          in: header
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      tags: [Pet]
      operationId: deletePet
      summary: Remove a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: The pet was removed
  /owners/{ownerName}/pets:
    get:
      tags: [Pet]
      operationId: listOwnerPets
      summary: List an owner's pets
      parameters:
        - name: ownerName
          in: path
          required: true
          schema:
            type: string
        - name: nickname
          in: query
          schema:
            type: string
        - name: tags
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: The owner's pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
  /shelters/{shelter}/pets:
    get:
      tags: [Pet]
      operationId: listShelterPets
      summary: List a shelter's pets
      parameters:
        - name: shelter
          in: path
          required: true
          description: The shelter's numeric ID or its name.
          schema:
            oneOf:
              - type: integer
              - type: string
        - name: after
          in: query
          description: The pet to continue after, by name or ID.
          schema:
            $ref: '#/components/schemas/PetReference'
        - name: species
          in: query
          description: One species, or several.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: ages
          in: query
          description: One age in years, or several.
          explode: false
          schema:
            oneOf:
              - type: integer
              - type: array
                items:
                  type: integer
        - name: exclude
          in: query
          description: Pets to leave out, by name or ID.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PetReference'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/Status'
        - name: X-Referring-Pet
          in: header
          schema:
            $ref: '#/components/schemas/PetReference'
        - name: lastPet
          in: cookie
          schema:
            $ref: '#/components/schemas/PetReference'
      responses:
        '200':
          description: The shelter's pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
  /pets/{petId}/notes:
    post:
      tags: [Pet]
      operationId: addPetNote
      summary: Add a note about a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                priority:
                  type: integer
                  format: int32
                relatedPet:
                  $ref: '#/components/schemas/PetReference'
                mentions:
                  description: Pets the note mentions, by name.
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
      responses:
        '204':
          description: The note was added
  /pets/{petId}/profile:
    put:
      tags: [Pet]
      operationId: updatePetProfile
      summary: Update a pet's profile
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [bio]
              properties:
                bio:
                  type: string
                nicknames:
                  type: array
                  items:
                    type: string
                age:
                  type: integer
                  format: int32
                bestFriend:
                  $ref: '#/components/schemas/PetReference'
      responses:
        '204':
          description: The profile was updated
components:
  schemas:
    Pet:
      description: A cat or dog identified by its species.
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: species
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'
    Cat:
      type: object
      required: [species, id, name, livesRemaining]
      properties:
        species:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
        livesRemaining:
          type: integer
    Dog:
      type: object
      additionalProperties: true
      required: [species, id, name, barkVolume]
      properties:
        species:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
        barkVolume:
          type: integer
    Status:
      type: string
      enum: [available, pending, sold]
    AdoptionRequest:
      description: An adopter chooses either a cat or a dog.
      type: object
      required: [adopterName]
      properties:
        adopterName:
          type: string
          description: Name of the person adopting the pet.
        cat:
          $ref: '#/components/schemas/Cat'
        dog:
          $ref: '#/components/schemas/Dog'
      oneOf:
        - required: [cat]
        - required: [dog]
    PetSearch:
      description: Search by name, availability, or both.
      type: object
      properties:
        name:
          type: string
          description: Name to search for.
        status:
          type: string
          enum: [available, pending]
        for:
          type: string
          description: What the pets are listed for.
          enum: [adoption, fostering]
      anyOf:
        - required: [name]
        - required: [status]
    PetRecord:
      description: An availability record with arbitrary additional details.
      type: object
      additionalProperties: true
      required: [status]
      properties:
        status:
          type: string
          enum: [available, pending]
    Listing:
      description: A pet listing published on a web page.
      type: object
      required: [kind, page]
      properties:
        kind:
          type: string
        page:
          type: string
          format: uri
          description: The listing's web page.
      discriminator:
        propertyName: kind
    AdoptionListing:
      allOf:
        - $ref: '#/components/schemas/Listing'
        - type: object
          required: [fee]
          properties:
            fee:
              type: integer
              format: int32
    PetReference:
      description: A pet name or a numeric pet ID.
      oneOf:
        - type: string
        - type: integer
          format: int64
    OptionalPetReference:
      description: A pet name, numeric ID, or no selected pet.
      nullable: true
      oneOf:
        - type: string
        - type: integer
          format: int64
    PetSummary:
      type: object
      required: [name]
      properties:
        name:
          type: string
        nickname:
          type: string
    RegisteredPet:
      allOf:
        - $ref: '#/components/schemas/PetSummary'
        - type: object
          required: [microchipId]
          properties:
            microchipId:
              type: string
    PetProfileChoice:
      description: Exclusive profiles overlap when a microchip ID is present.
      oneOf:
        - $ref: '#/components/schemas/PetSummary'
        - $ref: '#/components/schemas/RegisteredPet'
    PetProfileMatch:
      description: A profile may match both the summary and registered pet shapes.
      anyOf:
        - $ref: '#/components/schemas/PetSummary'
        - $ref: '#/components/schemas/RegisteredPet'
    PetIdentity:
      description: A pet summary, exactly a pet name, or an empty object for an unidentified pet.
      oneOf:
        - $ref: '#/components/schemas/PetSummary'
        - $ref: '#/components/schemas/PetName'
        - $ref: '#/components/schemas/EmptyObject'
    PetName:
      type: object
      required: [name]
      properties:
        name:
          type: string
      additionalProperties: false
    EmptyObject:
      type: object
      properties: {}
      additionalProperties: false
    PetList:
      description: A list of pet names or summaries, ambiguous when empty.
      oneOf:
        - type: array
          items:
            type: string
        - type: array
          items:
            $ref: '#/components/schemas/PetSummary'
    PetInventory:
      description: An inventory note or pet counts grouped by species.
      oneOf:
        - type: string
        - type: object
          additionalProperties:
            type: integer
            format: int32
    PetNote:
      description: A plain note or free-form note details.
      oneOf:
        - type: string
        - type: object
          additionalProperties: true
    PetArrival:
      description: Days until a pet arrives or its exact arrival time.
      oneOf:
        - type: integer
          format: int32
        - type: string
          format: date-time
    PetLocation:
      description: A pet's web page, shelter number, or list of web pages.
      oneOf:
        - type: string
          format: uri
        - type: integer
          format: int32
        - type: array
          items:
            type: string
            format: uri
    PetPhoto:
      type: object
      required: [content]
      properties:
        content:
          type: string
          format: binary
        thumbnail:
          type: string
          format: byte
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
        rating:
          $ref: '#/components/schemas/PetRating'
    PetRating:
      type: integer
      format: int32
      enum: [1, 2, 3]
    Shelter:
      type: object
      properties:
        id:
          type: integer
        record:
          title: Adoption Record
          type: object
          properties:
            notes:
              type: string
        archived:
          title: Adoption Record
          type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
        website:
          type: string
          format: uri
          default: https://petstore.example/shelters
    adoption-record:
      title: Adoption Record
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
    PetTags:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
            enum: [friendly, shy]
