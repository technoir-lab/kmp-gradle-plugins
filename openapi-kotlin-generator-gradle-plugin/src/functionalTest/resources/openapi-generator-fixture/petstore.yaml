openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
paths:
  /pets:
    get:
      tags: [Pet]
      operationId: listPets
      summary: List all pets
      parameters:
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int64
            enum: [10, 20, 50]
            default: 20
      responses:
        '200':
          description: All pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      tags: [Pet]
      operationId: addPet
      summary: Add a new pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    get:
      tags: [Pet]
      operationId: getPetById
      summary: Find a pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: includeDetails
          in: query
          schema:
            type: boolean
        - name: X-Request-ID
          in: header
          schema:
            type: string
        - name: sessionId
          in: cookie
          schema:
            type: string
        - name: requestUri
          in: query
          schema:
            type: string
            format: uri
        - name: requestUuid
          in: header
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      tags: [Pet]
      operationId: deletePet
      summary: Remove a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: The pet was removed
components:
  schemas:
    Pet:
      description: A cat or dog identified by its species.
      oneOf:
        - $ref: '#/components/schemas/Cat'
        - $ref: '#/components/schemas/Dog'
      discriminator:
        propertyName: species
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'
    Cat:
      type: object
      required: [species, id, name, livesRemaining]
      properties:
        species:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
        livesRemaining:
          type: integer
    Dog:
      type: object
      additionalProperties: true
      required: [species, id, name, barkVolume]
      properties:
        species:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
        barkVolume:
          type: integer
    Status:
      type: string
      enum: [available, pending, sold]
    AdoptionRequest:
      description: An adopter chooses either a cat or a dog.
      type: object
      required: [adopterName]
      properties:
        adopterName:
          type: string
          description: Name of the person adopting the pet.
        cat:
          $ref: '#/components/schemas/Cat'
        dog:
          $ref: '#/components/schemas/Dog'
      oneOf:
        - required: [cat]
        - required: [dog]
    PetSearch:
      description: Search by name, availability, or both.
      type: object
      properties:
        name:
          type: string
          description: Name to search for.
        status:
          type: string
          enum: [available, pending]
      anyOf:
        - required: [name]
        - required: [status]
    PetRecord:
      description: An availability record with arbitrary additional details.
      type: object
      additionalProperties: true
      required: [status]
      properties:
        status:
          type: string
          enum: [available, pending]
    PetReference:
      description: A pet name or a numeric pet ID.
      oneOf:
        - type: string
        - type: integer
          format: int64
    OptionalPetReference:
      description: A pet name, numeric ID, or no selected pet.
      nullable: true
      oneOf:
        - type: string
        - type: integer
          format: int64
    PetSummary:
      type: object
      required: [name]
      properties:
        name:
          type: string
        nickname:
          type: string
    RegisteredPet:
      allOf:
        - $ref: '#/components/schemas/PetSummary'
        - type: object
          required: [microchipId]
          properties:
            microchipId:
              type: string
    PetProfileChoice:
      description: Exclusive profiles overlap when a microchip ID is present.
      oneOf:
        - $ref: '#/components/schemas/PetSummary'
        - $ref: '#/components/schemas/RegisteredPet'
    PetProfileMatch:
      description: A profile may match both the summary and registered pet shapes.
      anyOf:
        - $ref: '#/components/schemas/PetSummary'
        - $ref: '#/components/schemas/RegisteredPet'
    PetList:
      description: A list of pet names or summaries, ambiguous when empty.
      oneOf:
        - type: array
          items:
            type: string
        - type: array
          items:
            $ref: '#/components/schemas/PetSummary'
    PetInventory:
      description: An inventory note or pet counts grouped by species.
      oneOf:
        - type: string
        - type: object
          additionalProperties:
            type: integer
            format: int32
    PetArrival:
      description: Days until a pet arrives or its exact arrival time.
      oneOf:
        - type: integer
          format: int32
        - type: string
          format: date-time
    PetLocation:
      description: A pet's web page, shelter number, or list of web pages.
      oneOf:
        - type: string
          format: uri
        - type: integer
          format: int32
        - type: array
          items:
            type: string
            format: uri
    PetPhoto:
      type: object
      required: [content]
      properties:
        content:
          type: string
          format: binary
        thumbnail:
          type: string
          format: byte
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
        rating:
          $ref: '#/components/schemas/PetRating'
    PetRating:
      type: integer
      format: int32
      enum: [1, 2, 3]
    Shelter:
      type: object
      properties:
        id:
          type: integer
        record:
          title: Adoption Record
          type: object
          properties:
            notes:
              type: string
        archived:
          title: Adoption Record
          type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    adoption-record:
      title: Adoption Record
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
